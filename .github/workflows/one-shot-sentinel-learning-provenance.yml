name: one-shot Sentinel learning provenance
on:
  push:
    branches:
      - sentinel-learning
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-learning
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: python scripts/patch_sentinel_learning_provenance.py
      - run: gofmt -w internal/services/sentinel_store.go
      - run: go vet ./...
      - run: go test ./...
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix(sentinel): preserve cross-Case learning provenance'
          git push origin HEAD:sentinel-learning
