name: Sentinel learning harden

on:
  push:
    branches: [sentinel-learning]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-learning
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Harden retention and promotion accounting
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")

          patch("internal/services/sentinel_learning_store.go", '\t"strings"\n\t"time"\n', '\t"strings"\n\t"sync"\n\t"time"\n')
          patch("internal/services/sentinel_learning_store.go",
          '''type sentinelRowScanner interface {
          \tScan(dest ...any) error
          }

          func ensureSentinelLearningTables(schema string) error {
          \tsafeSchema, err := sentinelSchema(schema)
          \tif err != nil {
          \t\treturn err
          \t}
          ''',
          '''type sentinelRowScanner interface {
          \tScan(dest ...any) error
          }

          var sentinelLearningSchemaReady sync.Map

          func ensureSentinelLearningTables(schema string) error {
          \tsafeSchema, err := sentinelSchema(schema)
          \tif err != nil {
          \t\treturn err
          \t}
          \tif _, ok := sentinelLearningSchemaReady.Load(safeSchema); ok {
          \t\treturn nil
          \t}
          ''')
          patch("internal/services/sentinel_learning_store.go",
          '''\t\tsafeSchema, safeSchema, safeSchema, safeSchema))
          \treturn err
          }
          ''',
          '''\t\tsafeSchema, safeSchema, safeSchema, safeSchema))
          \tif err == nil {
          \t\tsentinelLearningSchemaReady.Store(safeSchema, true)
          \t}
          \treturn err
          }
          ''')

          patch("internal/services/sentinel_learning_store.go",
          '''\t// Only matched evaluations count toward promotion. A skill that did not
          \t// apply to a Case neither helps nor hurts its score.
          \t// #nosec G201 -- safeSchema is validated; skillID is parameterized.
          \terr = database.DB.QueryRow(fmt.Sprintf(`SELECT
          \t\tCOUNT(*) FILTER (WHERE mode = 'REPLAY' AND matched),
          \t\tCOALESCE(AVG(score) FILTER (WHERE mode = 'REPLAY' AND matched), 0),
          \t\tCOUNT(*) FILTER (WHERE mode = 'SHADOW' AND matched),
          \t\tCOALESCE(AVG(score) FILTER (WHERE mode = 'SHADOW' AND matched), 0),
          \t\tCOUNT(*) FILTER (WHERE unsafe)
          \t\tFROM %s.sentinel_skill_evaluations WHERE skill_id = $1::uuid`, safeSchema), skillID).
          ''',
          '''\t// Promotion is based on distinct Cases, not raw evaluation rows. Re-running
          \t// one noisy Case therefore cannot inflate replay/shadow thresholds.
          \t// #nosec G201 -- safeSchema is validated; skillID is parameterized.
          \terr = database.DB.QueryRow(fmt.Sprintf(`WITH latest_per_case AS (
          \t\tSELECT DISTINCT ON (mode, case_id) mode, case_id, matched, score, unsafe
          \t\tFROM %s.sentinel_skill_evaluations
          \t\tWHERE skill_id = $1::uuid
          \t\tORDER BY mode, case_id, created_at DESC
          \t) SELECT
          \t\tCOUNT(*) FILTER (WHERE mode = 'REPLAY' AND matched),
          \t\tCOALESCE(AVG(score) FILTER (WHERE mode = 'REPLAY' AND matched), 0),
          \t\tCOUNT(*) FILTER (WHERE mode = 'SHADOW' AND matched),
          \t\tCOALESCE(AVG(score) FILTER (WHERE mode = 'SHADOW' AND matched), 0),
          \t\tCOUNT(*) FILTER (WHERE unsafe)
          \t\tFROM latest_per_case`, safeSchema), skillID).
          ''')

          patch("internal/services/sentinel_store.go",
          '''\t\tschema, err := database.SafeTenantSchema(tenant.SchemaAlias)
          \t\tif err != nil {
          \t\t\tcontinue
          \t\t}
          \t\tresult, err := database.DB.ExecContext(ctx, fmt.Sprintf(`DELETE FROM %s.sentinel_messages m USING %s.sentinel_conversations c
          ''',
          '''\t\tschema, err := database.SafeTenantSchema(tenant.SchemaAlias)
          \t\tif err != nil {
          \t\t\tcontinue
          \t\t}
          \t\tif err := ensureSentinelLearningTables(schema); err != nil {
          \t\t\treturn total, err
          \t\t}
          \t\tresult, err := database.DB.ExecContext(ctx, fmt.Sprintf(`DELETE FROM %s.sentinel_messages m USING %s.sentinel_conversations c
          ''')

          p = Path("internal/services/sentinel_store.go")
          text = p.read_text()
          old = '''\t\tresult, err = database.DB.ExecContext(ctx, fmt.Sprintf(`DELETE FROM %s.sentinel_cases
            WHERE resolved_at IS NOT NULL AND resolved_at < $1`, schema), cutoff)
          '''
          new = '''\t\tresult, err = database.DB.ExecContext(ctx, fmt.Sprintf(`DELETE FROM %s.sentinel_cases c
            WHERE c.resolved_at IS NOT NULL AND c.resolved_at < $1
            AND NOT EXISTS (
                SELECT 1 FROM %s.sentinel_learned_memories m
                WHERE m.source_case_id = c.id
                AND m.validation_state IN ('CANDIDATE','VALIDATED')
                AND m.expires_at > CURRENT_TIMESTAMP
            )
            AND NOT EXISTS (
                SELECT 1 FROM %s.sentinel_skills s
                WHERE s.source_case_id = c.id
                AND s.state IN ('DRAFT','VALIDATED','SHADOW','TRUSTED')
            )`, schema, schema, schema), cutoff)
          '''
          if old in text:
              p.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("sentinel case retention delete pattern not found")
      - name: Format
        run: gofmt -w internal/services/sentinel_learning_store.go internal/services/sentinel_store.go
      - name: Validate
        run: |
          go vet ./...
          go test ./...
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(sentinel): harden learning retention and promotion metrics"
          git push origin HEAD:sentinel-learning
