openapi: 3.1.0
info:
  title: openwrt-controller API
  version: 0.1.0
  description: |
    REST API for the openwrt-controller — a multi-tenant orchestrator
    for fleets of OpenWrt access points. Most endpoints require a JWT
    (Authorization: Bearer …). WebSockets use single-use tickets issued
    via `POST /api/ws-ticket`.

    **Stability:** This project is pre-1.0. The URL namespace is `/api/`
    without a version prefix. URL versioning (`/api/v1/`) will be
    introduced before 1.0.
  contact:
    name: tuxevil
    email: tuxevil@gmail.com
  license:
    name: MIT
    url: https://github.com/tuxevil/openwrt-controller/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://controller.example.com
    description: Production (replace with your host)

tags:
  - name: auth
    description: Login, logout, token refresh
  - name: sites
    description: Tenant sites (groups of OpenWrt devices)
  - name: devices
    description: Individual OpenWrt devices
  - name: wlans
    description: Wireless networks
  - name: clients
    description: Connected Wi-Fi clients
  - name: telemetry
    description: Device telemetry ingest
  - name: global
    description: Platform-wide operations (SuperAdmin)
  - name: chatops
    description: LLM / chat-driven device queries
  - name: sentinel
    description: Sentinel investigations and operator-approved proposals
  - name: probes
    description: Container liveness / readiness (anonymous)
  - name: metrics
    description: Prometheus exposition (anonymous)
  - name: orchestrator
    description: Immutable site rollout previews and execution

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      summary: Exchange username + password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:    { type: string }
                  username: { type: string }
                  role:     { type: string, enum: [superadmin, admin, user] }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ws-ticket:
    post:
      tags: [auth]
      operationId: issueWebSocketTicket
      summary: Issue a single-use device-scoped WebSocket ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSocketTicketRequest'
      responses:
        '200':
          description: Short-lived ticket for one device SSH session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/devices/{device_id}/ssh:
    get:
      tags: [devices]
      operationId: openDeviceSSHWebSocket
      summary: Upgrade to a device SSH WebSocket using a single-use ticket
      description: The ticket must have been issued for this exact device.
      security:
        - webSocketTicket: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - in: query
          name: ticket
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Telemetry ─────────────────────────────────────────────────────────────
  /api/telemetry:
    post:
      tags: [telemetry]
      summary: Device → controller telemetry post
      description: |
        Called by the OpenWrt agent. Authenticates via `X-Device-Token`
        header (preferred) or the legacy provision API key (set
        `ALLOW_LEGACY_PROVISION=false` once all devices are migrated).
      security: []
      responses:
        '204': { description: Accepted }

  /api/devices/{device_id}/config:
    get:
      tags: [devices]
      summary: Fetch the agent's per-device config
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Agent config block
          content:
            application/json: {}
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Sites ─────────────────────────────────────────────────────────────────
  /api/sites:
    get:
      tags: [sites]
      summary: List all sites visible to the caller
      responses:
        '200':
          description: Site list
          content:
            application/json: {}
    post:
      tags: [sites]
      summary: Create a new site
      responses:
        '201': { description: Created }

  /api/sites/{site_id}:
    delete:
      tags: [sites]
      summary: Delete a site (admin only)
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '204': { description: Deleted }

  /api/sites/{site_id}/rotate-key:
    post:
      tags: [sites]
      summary: Rotate the site's API key
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200':
          description: New key
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }

  /api/sites/{site_id}/devices:
    get:
      tags: [sites, devices]
      summary: List devices in a site
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Device list }

  /api/sites/{site_id}/wlans:
    get:
      tags: [sites, wlans]
      summary: List WLANs
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: WLAN list }
    post:
      tags: [sites, wlans]
      summary: Create a WLAN
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '201': { description: Created }

  /api/sites/{site_id}/clients:
    get:
      tags: [sites, clients]
      summary: List connected clients
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Client list }

  /api/sites/{site_id}/incidents:
    get:
      tags: [sites]
      summary: Recent incidents
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Incident list }

  /api/sites/{site_id}/topology:
    get:
      tags: [sites]
      summary: Site topology (devices + links)
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Topology }

  /api/sites/{site_id}/echolocation:
    get:
      tags: [sites]
      summary: Echo-location heatmap
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Heatmap data }

  /api/sites/{site_id}/flow-sense:
    get:
      tags: [sites]
      summary: Flow Sense (DPI) data
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Flow data }

  /api/sites/{site_id}/rf-optimization:
    get:
      tags: [sites]
      summary: RF optimization recommendations
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: RF recommendations }

  /api/sites/{site_id}/rf-fix:
    post:
      tags: [sites]
      summary: Apply a recommended RF fix
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '202': { description: Accepted }

  /api/sites/{site_id}/history:
    get:
      tags: [sites]
      summary: Per-site historical events
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: History }

  /api/sites/{site_id}/logs:
    get:
      tags: [sites]
      summary: Per-site log tail
      parameters:
        - $ref: '#/components/parameters/SiteID'
      responses:
        '200': { description: Logs }

  # ── Site orchestrator ─────────────────────────────────────────────────────
  /api/sites/{site_id}/orchestrator/preview:
    post:
      tags: [orchestrator]
      operationId: previewSiteRollout
      summary: Render and persist an immutable rollout draft
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - in: query
          name: target_device_id
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Immutable rollout draft preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloutDraftPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/sites/{site_id}/orchestrator/sync:
    post:
      tags: [orchestrator]
      operationId: applySiteRollout
      summary: Apply one immutable rollout draft
      parameters:
        - $ref: '#/components/parameters/SiteID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolloutApplyRequest' }
      responses:
        '200':
          description: Rollout completed or stopped by staged execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloutResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/sites/{site_id}/orchestrator/rollouts:
    get:
      tags: [orchestrator]
      operationId: listSiteRollouts
      summary: List rollout drafts and execution history
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Rollout history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RolloutRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/sites/{site_id}/orchestrator/rollouts/{rollout_id}:
    get:
      tags: [orchestrator]
      operationId: getSiteRollout
      summary: Read one rollout record
      parameters:
        - $ref: '#/components/parameters/SiteID'
        - in: path
          name: rollout_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rollout record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloutRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ── Devices ───────────────────────────────────────────────────────────────
  /api/devices:
    get:
      tags: [devices]
      summary: List all devices
      responses:
        '200': { description: Device list }

  /api/devices/{device_id}:
    delete:
      tags: [devices]
      summary: Forget a device (admin only)
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204': { description: Forgotten }

  /api/devices/{device_id}/adopt:
    post:
      tags: [devices]
      summary: Adopt a device into a site
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200': { description: Adopted }

  /api/devices/{device_id}/migrate:
    post:
      tags: [devices]
      summary: Migrate a device to another site
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200': { description: Migrated }

  /api/devices/{device_id}/pcap:
    post:
      tags: [devices]
      summary: Capture a packet trace
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '202': { description: Capture started }

  /api/devices/{device_id}/central-config:
    put:
      tags: [devices]
      summary: Queue a typed UCI configuration change
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/Config'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UciOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/QueuedDeviceOperation'

  /api/devices/{device_id}/safe-rollout:
    post:
      tags: [devices]
      summary: Queue a confirmed single-device UCI rollout
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/Config'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UciOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/QueuedDeviceOperation'

  /api/devices/{id}/edge-network:
    put:
      tags: [devices]
      summary: Queue an edge network configuration change
      parameters:
        - $ref: '#/components/parameters/EdgeDeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/QueuedDeviceOperation'

  /api/devices/{id}/edge-dhcp:
    put:
      tags: [devices]
      summary: Queue an edge DHCP configuration change
      parameters:
        - $ref: '#/components/parameters/EdgeDeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/QueuedDeviceOperation'

  /api/devices/{id}/edge-firewall:
    put:
      tags: [devices]
      summary: Queue an edge firewall configuration change
      parameters:
        - $ref: '#/components/parameters/EdgeDeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeOperationRequest'
      responses:
        '202':
          $ref: '#/components/responses/QueuedDeviceOperation'

  /api/sentinel/proposals/{proposal_id}/approve:
    post:
      tags: [sentinel]
      summary: Approve a Sentinel proposal and queue its device operation
      parameters:
        - $ref: '#/components/parameters/ProposalID'
      responses:
        '200':
          $ref: '#/components/responses/ApprovedSentinelProposal'

  /api/devices/{device_id}/iperf:
    post:
      tags: [devices]
      summary: Run an iperf3 test
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '202': { description: Test started }

  /api/devices/{device_id}/metrics:
    get:
      tags: [devices]
      summary: Live metrics for a device
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200': { description: Metrics }

  # ── Global ────────────────────────────────────────────────────────────────
  /api/global/health:
    get:
      tags: [global]
      summary: Business health score (0–100)
      responses:
        '200':
          description: Health score
          content:
            application/json:
              schema:
                type: object
                properties:
                  health: { type: integer, minimum: 0, maximum: 100 }

  /api/global/sentinel:
    get:
      tags: [global]
      summary: Sentinel AI insights
      responses:
        '200': { description: Insights }

  /api/global/sentinel/trigger:
    post:
      tags: [global]
      summary: Manually trigger a Sentinel scan
      responses:
        '202': { description: Scan started }

  /api/global/settings:
    get:
      tags: [global]
      summary: Platform settings
      responses:
        '200': { description: Settings }
    post:
      tags: [global]
      summary: Update platform settings
      responses:
        '200': { description: Updated }

  # ── ChatOps ───────────────────────────────────────────────────────────────
  /api/chatops/query:
    post:
      tags: [chatops]
      summary: Natural-language query → device action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200': { description: Answer }

  # ── Probes (anonymous) ────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [probes]
      summary: Liveness probe
      description: |
        Anonymous. Returns 200 as long as the process is up. Used by
        container orchestrators (Docker, Kubernetes) for liveness.
      security: []
      responses:
        '200':
          description: Alive
          content:
            text/plain:
              schema: { type: string, example: ok }

  /readyz:
    get:
      tags: [probes]
      summary: Readiness probe
      description: |
        Anonymous. Returns 200 only when the controller can reach
        Postgres. Used as the readiness gate in orchestrators.
      security: []
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready (DB unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not-ready }
                  error:  { type: string }

  # ── Metrics (anonymous) ───────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus exposition
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSocketTicket:
      type: apiKey
      in: query
      name: ticket

  parameters:
    SiteID:
      in: path
      name: site_id
      required: true
      schema: { type: string, format: uuid }
    DeviceID:
      in: path
      name: device_id
      required: true
      schema: { type: string }
    EdgeDeviceID:
      in: path
      name: id
      required: true
      schema: { type: string }
    Config:
      in: query
      name: config
      required: true
      schema: { type: string }
    ProposalID:
      in: path
      name: proposal_id
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal is not allowed to access the resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Device transport or preflight failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QueuedDeviceOperation:
      description: Operation accepted for the device agent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedDeviceOperation' }
    ApprovedSentinelProposal:
      description: Sentinel proposal approved and queued
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovedSentinelProposal' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:    { type: string }
        request_id: { type: string, description: 'Correlation ID for log lookup' }
    WebSocketTicketRequest:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string }
    WebSocketTicketResponse:
      type: object
      required: [ticket, expires_in, expires_at, token_type]
      properties:
        ticket: { type: string, minLength: 32, maxLength: 32 }
        expires_in: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        token_type: { type: string, enum: [Ticket] }
    QueuedDeviceOperation:
      type: object
      required: [status, operation_id, plan_hash, generation, message]
      properties:
        status: { type: string, enum: [queued] }
        operation_id: { type: string, description: Unique execution attempt identity }
        plan_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hash of the immutable operation content
        generation:
          type: integer
          format: int64
          minimum: 1
          description: Device configuration revision reserved for this operation
        message: { type: string }
    ApprovedSentinelProposal:
      type: object
      required: [status, proposal_id, operation_id, plan_hash, generation]
      properties:
        status: { type: string, enum: [APPROVED] }
        proposal_id: { type: string, format: uuid }
        operation_id: { type: string }
        plan_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        generation: { type: integer, format: int64, minimum: 1 }
    UciOperationRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          items: { type: object }
        confirm: { type: boolean, default: false }
        health_checks:
          type: array
          items: { type: string }
    EdgeOperationRequest:
      type: object
      description: The typed payload depends on the edge namespace.
      additionalProperties: true
      properties:
        confirm: { type: boolean, default: false }
        health_checks:
          type: array
          items: { type: string }
    RolloutApplyRequest:
      type: object
      required: [rollout_id]
      properties:
        rollout_id: { type: string, format: uuid }
    RolloutDevicePreview:
      type: object
      required: [device_id, hostname, role, commands, count, scripts, observed_state]
      properties:
        device_id: { type: string }
        hostname: { type: string }
        role: { type: string }
        commands:
          type: array
          items: { type: string }
        count: { type: integer, minimum: 0 }
        scripts:
          type: object
          additionalProperties: { type: string }
        observed_state:
          type: object
          additionalProperties: { type: string }
    RolloutDraftPreview:
      type: object
      required: [site_id, rollout_id, generation, plan_hash, devices, total]
      properties:
        site_id: { type: string, format: uuid }
        rollout_id: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        plan_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        target_device_id: { type: string, nullable: true }
        health_checks:
          type: array
          items: { type: string }
        devices:
          type: array
          items: { $ref: '#/components/schemas/RolloutDevicePreview' }
        total: { type: integer, minimum: 1 }
    RolloutResult:
      type: object
      required: [status, rollout_id, generation, successes, failures, results]
      properties:
        status: { type: string }
        rollout_id: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        target_device_id: { type: string, nullable: true }
        successes: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: '#/components/schemas/RolloutDeviceResult' }
    RolloutDeviceResult:
      type: object
      required: [device_id, hostname, role, status, cmd_count]
      properties:
        device_id: { type: string }
        hostname: { type: string }
        role: { type: string }
        status: { type: string }
        output: { type: string }
        error: { type: string }
        cmd_count: { type: integer, minimum: 0 }
    RolloutRecord:
      type: object
      required: [id, site_id, generation, status, plan_hash, target_device_ids, plan, results]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        status: { type: string }
        plan_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        requested_by: { type: string }
        target_device_ids:
          type: array
          items: { type: string }
        plan: { type: object, additionalProperties: true }
        results:
          type: array
          items: { $ref: '#/components/schemas/RolloutDeviceResult' }
        preview:
          type: array
          items: { $ref: '#/components/schemas/RolloutDevicePreview' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

security:
  - bearerAuth: []
